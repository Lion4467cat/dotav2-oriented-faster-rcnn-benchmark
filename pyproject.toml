[project]
name = "dotav2-oriented-faster-rcnn-benchmark"
version = "0.1.0"
description = "DOTA v2.0 Oriented Faster R-CNN benchmark suite designed for Google Colab Pro/Pro+ (L4/A100)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gdown>=5.2.0",
    "nbformat>=5.10.4",
    "numpy>=1.26.4",
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "tqdm>=4.66.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
per-file-ignores = {"configs/*.py" = ["C408"]}

